# SaEDU Flow — ส่วนหัวความปลอดภัย (สร้างโดย scripts/server/gen-nginx-headers.mjs จาก vercel.json — ห้ามแก้มือ)
# include ไฟล์นี้ใน server {} ของ saeduflow.edu.chula.ac.th และใน location {} ทุกอันที่มี add_header ของตัวเอง
# (nginx ไม่สืบทอด add_header จาก server เข้า location ที่มี add_header อยู่แล้ว — ลืม include ที่นั่น = ส่วนหัวหายเงียบ ๆ)
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net data:; img-src 'self' data: blob: https://jrubupvzltxqstzcpoov.supabase.co; connect-src 'self' https://jrubupvzltxqstzcpoov.supabase.co https://cdn.jsdelivr.net https://*.cloudconvert.com; frame-src https://jrubupvzltxqstzcpoov.supabase.co; worker-src 'self' blob: https://cdnjs.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cache-Control "no-cache" always;
