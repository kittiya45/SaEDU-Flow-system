# Include once inside the production HTTPS server {} (not inside location {}).
# Static-only host: never execute PHP/CGI, expose backups, configs or source folders.
location ~ (^|/)\. { return 404; }
location ~* \.(?:env|sql|sqlite|db|bak|backup|log|sh|mjs|ts|php[0-9]?|phtml|phar|cgi|pl|py|pem|key|zip|tar|gz|txt|md|map)$ { return 404; }
location ~ ^/(?:supabase|scripts|node_modules|tests|deliverables|backup[^/]*)(?:/|$) { return 404; }
location ~ ^/(?:server\.js|package(?:-lock)?\.json|public-files\.json|vercel\.json)$ { return 404; }
