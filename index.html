<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ระบบเสนอเอกสาร กนค.</title>
<link rel="icon" type="image/png" href="img/logo.png">
<link rel="preconnect" href="https://jrubupvzltxqstzcpoov.supabase.co">
<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="dns-prefetch" href="https://unpkg.com">
<!-- Lucide icons — vendored ใน vendor/ (เดิมโหลดจาก unpkg ตรงๆ ทุกครั้งที่เปิดแอป ถ้า unpkg ล่มไอคอนหายทั้งระบบ) -->
<script src="vendor/lucide.js?v=1" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<!-- คอมไพล์จาก tailwind.css ด้วย `npm run build` — ไม่ใช่ Tailwind CDN อีกต่อไป (ดู package.json) -->
<link rel="stylesheet" href="styles.tailwind.css?v=5">
<link rel="stylesheet" href="styles.css?v=66">
</head>
<body>
<div id="app"></div>

<!-- Supabase Auth client (เวอร์ชันตรึงไว้ vendored ใน vendor/ — เดิมโหลดจาก jsdelivr แบบ blocking ทุกครั้งที่เปิดแอป ถ้า jsdelivr ล่มแอปทั้งระบบบูตไม่ขึ้น) -->
<script src="vendor/supabase.js?v=1"></script>

<!-- ตั้งค่า API, ตัวแปรหลัก และสิทธิ์ใช้งาน -->
<script src="config.js?v=34" defer></script>

<!-- รวมฟังก์ชันช่วยจัดการหน้าจอและแจ้งเตือน -->
<script src="utils.js?v=40" defer></script>

<!-- ตัวดักจับการคลิกและส่งคำสั่งจัดการหน้าเว็บ -->
<script src="events.js?v=12" defer></script>

<!-- ระบบ Login และจัดการเซสชันผู้ใช้ -->
<script src="auth.js?v=23" defer></script>

<!-- หน้าสรุปผลและรายการงานล่าสุด (homeViews.js + dashboard.js สำรอง — ad blocker/cache มักบล็อกชื่อ dashboard.js) -->
<script src="homeViews.js?v=23" defer></script>

<!-- ตารางรายการเอกสารและการค้นหา -->
<script src="docList.js?v=35" defer></script>

<!-- ฟอร์มสร้าง/แก้ไขเอกสารและอัปโหลดไฟล์ -->
<script src="docForm.js?v=38" defer></script>

<!-- ระบบอนุมัติ ตีกลับ และส่งต่อเอกสาร -->
<script src="workflow.js?v=17" defer></script>

<!-- ประวัติเอกสารและดาวน์โหลดรายงาน CSV -->
<script src="report.js?v=4" defer></script>

<!-- modal อนุมัติ/ส่งคืน และ signature placement (ต้องโหลดก่อน docDetail) -->
<script src="docSign.js?v=17" defer></script>

<script src="sigProfile.js?v=2" defer></script>

<!-- หน้าแสดงรายละเอียดเอกสาร อนุมัติ/ตีกลับ และฝังลายเซ็นใน PDF -->
<script src="docDetail.js?v=54" defer></script>

<!-- ออกเลขที่หนังสือขาออก (สร้างเลขอัตโนมัติในรูปแบบ SPPTNNN หรือ SPPTNNN-CC) -->
<script src="docNum.js?v=27" defer></script>

<!-- ส่งอีเมลแจ้งเตือนผ่าน Edge Function และตรวจเอกสารที่เลยกำหนด -->
<script src="notif.js?v=16" defer></script>

<!-- หน้าต่างเปิดดูไฟล์ PDF และรูปภาพ -->
<script src="viewer.js?v=6" defer></script>

<!-- เครื่องมือแก้ไข PDF และใส่ลายเซ็น -->
<script src="editor.js?v=3" defer></script>

<!-- กราฟสถิติและติดตามงานค้าง -->
<script src="stats.js?v=29" defer></script>

<!-- หน้าจัดการระบบ: เลขที่เอกสาร -->
<script src="sysAdmin.js?v=31" defer></script>

<!-- เครื่องมือนักพัฒนา (เฉพาะ ROLE-DEV — แยกจากแอดมิน): สุขภาพระบบ, log, ซ่อมเอกสาร, ทดสอบระบบ, จัดการระบบฝัง -->
<script src="dev-sql-bundle.js?v=3" defer></script>
<script src="dev.js?v=27" defer></script>

<!-- หน้าจัดการระบบ: ประเภทเอกสาร-->
<script src="docTypeAdmin.js?v=2" defer></script>

<!-- แบบฟอร์มดาวน์โหลด -->
<script src="templates.js?v=15" defer></script>

<!-- จัดการผู้ใช้งาน: อนุมัติบัญชี แก้ไขข้อมูล รีเซ็ตรหัสผ่าน เพิ่มอาจารย์ -->
<script src="admin.js?v=14" defer></script>

<!-- นำเข้าผู้ใช้หลายคนพร้อมกันจากไฟล์ CSV (เฉพาะ ROLE-SYS) -->
<script src="adminImport.js?v=2" defer></script>

<!-- จัดการโครงสร้างเมนูและหน้าตาเว็บหลัก -->
<script src="layout.js?v=21" defer></script>

<!-- ตัวเริ่มรันระบบ — เช็ค session ที่ค้างไว้ก่อน (Supabase Auth) ถ้าไม่มีค่อยเรียกหน้า Login -->
<script src="boot.js?v=3" defer></script>

</body>
</html>
